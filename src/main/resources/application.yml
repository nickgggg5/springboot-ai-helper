# 应用服务 WEB 访问端口
server:
  port: 8080


spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mental_health_assistant?useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&allowMultiQueries=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

    ai:
      openai:
        chat:
          options:
            model: deepseek-ai/DeepSeek-V3
            tool-calling:
              enabled: true
          completions-path: /v1/chat/completions
        api-key: you-key
        base-url: https://api.siliconflow.cn

# JWT配置
jwt:
  secret: MySecretKeyForJWT2025!@#$%^&*()_+SecureKeyHere
  expiration: 86400000  # 24小时（毫秒）
  refresh-expiration: 604800000  # 7天（毫秒）
  header: Authorization  # token头部名称
  token-prefix: "Bearer "  # token前缀